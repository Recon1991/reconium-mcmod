plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "reconium.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.mc_1_20_1_forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.mc_1_20_1_architectury_api_version}"

    common(project(path: ':1.20.1:common', configuration: 'namedElements')) {
        transitive = false
    }

    shadowBundle project(path: ':1.20.1:common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
}
